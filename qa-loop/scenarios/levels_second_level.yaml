name: Second level with levelRef scoping
description: Add a second level, place room/dimension/label on it via levelRef param, assert levelRef fields are set.
target:
  os: [linux]
  mode: [web]
setup:
  - command: new_home
    params: {}
steps:
  - command: add_level
    params: {name: "Ground Floor", elevation: 0, floorThickness: 30}
  - command: add_room
    params: {points: [[0, 0], [600, 0], [600, 400], [0, 400]], levelRef: "level-1"}
  - command: add_dimension_line
    params: {xStart: 0, yStart: 0, xEnd: 600, yEnd: 0, offset: 0, levelRef: "level-1"}
  - command: add_label
    params: {x: 300, y: 200, text: "Living Room", levelRef: "level-1"}
checkpoints:
  - afterStep: 4
    capture: [state, plan, 3d]
assertions:
  - at: 4
    artifact: state
    kind: count
    path: levels
    value: 1
  - at: 4
    artifact: state
    kind: count
    path: rooms
    value: 1
  - at: 4
    artifact: state
    kind: equals
    path: rooms.0.levelRef
    value: "level-1"
  - at: 4
    artifact: state
    kind: count
    path: dimensionLines
    value: 1
  - at: 4
    artifact: state
    kind: equals
    path: dimensionLines.0.levelRef
    value: "level-1"
  - at: 4
    artifact: state
    kind: count
    path: labels
    value: 1
  - at: 4
    artifact: state
    kind: equals
    path: labels.0.levelRef
    value: "level-1"
