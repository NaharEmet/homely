name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  homely:
    name: homely (lint + tsc + vitest + e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homely
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: homely/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  equivalence:
    name: equivalence (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: equivalence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv
      - run: uv sync --dev
      - run: uv run pytest -q
